server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             spatovaliyski.com;
    root                    /var/www/spatovaliyski.com/runtime/current/dist/client;
    include                 /etc/nginx/mime.types;

    ssl_certificate         /etc/letsencrypt/live/spatovaliyski.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/spatovaliyski.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/spatovaliyski.com/chain.pem;

    include                 /etc/nginx/snippets/portfolio-security.conf;

    access_log              /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log               /var/log/nginx/error.log warn;


    location ~ /\. { deny all; }
    location ~ \.map$ { deny all; }
    location /assets/ {
        alias /var/www/spatovaliyski.com/runtime/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/portfolio-security.conf;
    }
    location /admin/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/portfolio-security.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 21m;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/portfolio-security.conf;
    }
}

server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             *.spatovaliyski.com;

    ssl_certificate         /etc/letsencrypt/live/spatovaliyski.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/spatovaliyski.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/spatovaliyski.com/chain.pem;
    return                  301 https://spatovaliyski.com$request_uri;
}

server {
    listen      80;
    listen      [::]:80;
    server_name .spatovaliyski.com;
    include     nginxconfig.io/letsencrypt.conf;
    include     /etc/nginx/mime.types;

    location / {
        return 301 https://spatovaliyski.com$request_uri;
    }
}
