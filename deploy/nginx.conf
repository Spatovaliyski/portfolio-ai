# Install as /etc/nginx/sites-available/portfolio after preserving the old configuration.
# Replace /srv/portfolio only if PORTFOLIO_DEPLOY_ROOT uses a different absolute path.
map $uri $portfolio_redirect {
    default "";
    include /srv/portfolio/current/redirects.map;
}
server {
    listen 80;
    server_name spatovaliyski.com www.spatovaliyski.com;
    return 301 https://spatovaliyski.com$request_uri;
}
server {
    listen 443 ssl;
    server_name www.spatovaliyski.com;
    ssl_certificate /etc/letsencrypt/live/spatovaliyski.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spatovaliyski.com/privkey.pem;
    return 301 https://spatovaliyski.com$request_uri;
}
server {
    listen 443 ssl;
    server_name spatovaliyski.com;
    ssl_certificate /etc/letsencrypt/live/spatovaliyski.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spatovaliyski.com/privkey.pem;
    root /srv/portfolio/current;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    include /etc/nginx/snippets/portfolio-security.conf;
    if ($portfolio_redirect != "") { return 301 $portfolio_redirect$is_args$args; }
    error_page 404 /404/index.html;
    location = /404/ { return 404; }
    location = /404/index.html { internal; add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/portfolio-security.conf; }
    location ~ /\. { deny all; }
    location ~ \.map$ { deny all; }
    location /assets/ { alias /srv/portfolio/shared/assets/; expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/snippets/portfolio-security.conf; }
    location /media/ { alias /srv/portfolio/shared/media/; expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/snippets/portfolio-security.conf; }
    location /social/ { alias /srv/portfolio/shared/social/; expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/snippets/portfolio-security.conf; }
    location /admin/ { try_files $uri $uri/ =404; add_header Cache-Control "no-store" always; add_header X-Robots-Tag "noindex, nofollow" always; include /etc/nginx/snippets/portfolio-security.conf; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/portfolio-security.conf; }
}
