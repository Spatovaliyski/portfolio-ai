# Replace the spatovaliyski.com site file with this one.
# Install deploy/portfolio-security.conf as /etc/nginx/snippets/portfolio-security.conf first.
# Do not reload until /var/www/spatovaliyski.com/current/redirects.map exists.
map $uri $portfolio_redirect {
    default "";
    include /var/www/spatovaliyski.com/current/redirects.map;
}

server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             spatovaliyski.com;
    root                    /var/www/spatovaliyski.com/current;
    include                 /etc/nginx/mime.types;

    ssl_certificate         /etc/letsencrypt/live/spatovaliyski.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/spatovaliyski.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/spatovaliyski.com/chain.pem;

    include                 nginxconfig.io/security.conf;
    include                 /etc/nginx/snippets/portfolio-security.conf;

    access_log              /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log               /var/log/nginx/error.log warn;

    include                 nginxconfig.io/general.conf;

    if ($portfolio_redirect != "") { return 301 $portfolio_redirect$is_args$args; }

    error_page 404 /404/index.html;

    location = /404/ { return 404; }
    location = /404/index.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/portfolio-security.conf;
    }
    location ~ /\. { deny all; }
    location ~ \.map$ { deny all; }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/portfolio-security.conf;
    }
    location /media/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/portfolio-security.conf;
    }
    location /social/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/portfolio-security.conf;
    }
    location /admin/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/portfolio-security.conf;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/portfolio-security.conf;
    }
}

server {
    listen                  443 ssl http2;
    listen                  [::]:443 ssl http2;
    server_name             *.spatovaliyski.com;

    ssl_certificate         /etc/letsencrypt/live/spatovaliyski.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/spatovaliyski.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/spatovaliyski.com/chain.pem;
    return                  301 https://spatovaliyski.com$request_uri;
}

server {
    listen      80;
    listen      [::]:80;
    server_name .spatovaliyski.com;
    include     nginxconfig.io/letsencrypt.conf;
    include     /etc/nginx/mime.types;

    location / {
        return 301 https://spatovaliyski.com$request_uri;
    }
}
