name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: portfolio-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run build && npm run check:build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Update GitHub synchronization function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            npx --yes supabase@2.120.0 functions deploy content publication automation public-content --project-ref lmxukzcvxhpbwtgsbrai
          fi
      - name: Deploy the application runtime
        env:
          SSH_KEY: ${{ secrets.PORTFOLIO_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PORTFOLIO_SSH_KNOWN_HOSTS }}
          SSH_TARGET: ${{ vars.PORTFOLIO_SSH_TARGET }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_TARGET" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "Configure the production SSH target, key, and known hosts." >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" "install -d -m 700 /etc/portfolio; mkdir -p /var/www/spatovaliyski.com/runtime/releases/$GITHUB_SHA"
          node --experimental-strip-types scripts/runtime-environment.ts | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" "umask 077; cat > /etc/portfolio/runtime.env"
          rsync -az -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes" dist deploy package.json package-lock.json "$SSH_TARGET:/var/www/spatovaliyski.com/runtime/releases/$GITHUB_SHA/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" "bash /var/www/spatovaliyski.com/runtime/releases/$GITHUB_SHA/deploy/runtime.sh $GITHUB_SHA"
