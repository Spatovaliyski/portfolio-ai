name: Deploy Supabase functions
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: portfolio-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run build && npm run check:build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Update GitHub synchronization function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            npx --yes supabase@2.120.0 functions deploy content publication automation public-content --project-ref lmxukzcvxhpbwtgsbrai
          fi

# The portfolio Worker builds and deploys from main through Cloudflare Builds.
