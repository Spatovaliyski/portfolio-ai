name: Synchronize curated public GitHub data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-github-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    env:
      PORTFOLIO_MACHINE_TOKEN: ${{ secrets.PORTFOLIO_MACHINE_TOKEN }}
      GITHUB_PUBLIC_TOKEN: ${{ secrets.GITHUB_PUBLIC_TOKEN }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run sync:github -- $([ $(( $(date -u +%H) % 6 )) -eq 0 ] && printf -- '--refresh' || true)
