name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: bash tests/deployment.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify native schema validation in isolated local Supabase
        run: |
          npx --yes supabase@2.120.0 start
          npx --yes supabase@2.120.0 db reset --local
          npx --yes --package=supabase@2.120.0 --package=tsx@4.23.15 -- tsx scripts/native-schema-proof.ts
      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.120.0 stop --no-backup
